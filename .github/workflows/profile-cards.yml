name: profile-cards

on:
  schedule:
    - cron: "17 6 * * *"        # daily, 01:17 Panama time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "brand/**", "package*.json"]   # dist/ excluded → no self-trigger loop

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PROFILE_LOGIN: ${{ github.repository_owner }}
          # PROFILE_TOKEN (classic PAT, read:user) counts private contributions;
          # falls back to GITHUB_TOKEN = public data only.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit cards if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/*.svg
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(cards): refresh profile cards [skip ci]"
          git push
